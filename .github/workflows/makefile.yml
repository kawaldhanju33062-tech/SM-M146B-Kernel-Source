name: Build M14x Permissive Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: Checkout Build Script
        uses: actions/checkout@v4
        with:
          repository: s5e8535/kernel_build_script
          path: build-script

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 wget tar xz-utils

      - name: Setup Clang Toolchain (LLVM 14.0.6)
        run: |
          mkdir -p clang
          # Downloading the official LLVM 14.0.6 Linux x86_64 binary
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          # Extracting to the clang folder
          tar -xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C clang --strip-components=1
          # Adding clang/bin to the system path
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH
          rm clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz

      - name: Verify Clang Version
        run: clang --version

      - name: Build Kernel using Script
        working-directory: kernel-source
        run: |
          # Copying the build script into the source directory
          cp ../build-script/build.sh .
          chmod +x build.sh
          
          # Setting environment variables for the M14x build
          export DEVICE=m14x
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Running the script
          ./build.sh

      - name: Verify Output
        run: |
          echo "Checking for build outputs..."
          # Locating the generated kernel image and DTB files
          find kernel-source/out -name "Image*"
          find kernel-source/out -name "dtbo.img"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M14x-Permissive-Kernel
          path: |
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/dtbo.img
            
