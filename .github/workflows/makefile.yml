name: Build M14x Permissive Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: Checkout Build Script
        uses: actions/checkout@v4
        with:
          repository: s5e8535/kernel_build_script
          path: build-script

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang llvm lld libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

      - name: Setup Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          # Add Clang and the build script directory to PATH
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel using Script
        working-directory: kernel-source
        run: |
          # Copy the script into the kernel source directory as instructed by the repo
          cp ../build-script/build.sh .
          chmod +x build.sh
          
          # Set required environment variables for the script
          export DEVICE=m14x
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Run the build script
          ./build.sh

      - name: Verify Output
        run: |
          echo "Checking for build outputs..."
          # The script usually outputs to 'out' or a 'zipper' folder
          find kernel-source/out -name "Image*" || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M14x-Kernel
          path: |
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/dtbo.img
            
